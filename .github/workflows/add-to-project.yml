# Reusable: put a newly opened issue or pull request on the estate board. The Free
# plan allows one UI auto-add workflow per project, so every repository calls this
# instead. The caller passes `secrets: inherit`.
name: add-to-project

on:
  workflow_call:

permissions: {}

jobs:
  add:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.PHAETHUSA_APP_ID }}
          private-key: ${{ secrets.PHAETHUSA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/HeliosBBS/projects/1
          github-token: ${{ steps.app.outputs.token }}
