name: Sync labels

on:
  push:
    branches: [main]
    paths: [labels.json]
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.PHAETHUSA_APP_ID }}
          private-key: ${{ secrets.PHAETHUSA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Apply the label set to every repository
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          wanted=$(jq -r '.[].name' labels.json)
          for repo in $(gh repo list "$OWNER" --limit 100 --json name --jq '.[].name'); do
            echo "== $OWNER/$repo"
            jq -c '.[]' labels.json | while read -r label; do
              gh label create "$(jq -r .name <<<"$label")" \
                --repo "$OWNER/$repo" --force \
                --color "$(jq -r .color <<<"$label")" \
                --description "$(jq -r .description <<<"$label")"
            done
            gh label list --repo "$OWNER/$repo" --limit 200 --json name --jq '.[].name' | while read -r existing; do
              grep -qx "$existing" <<<"$wanted" || gh label delete "$existing" --repo "$OWNER/$repo" --yes
            done
          done
