# Reusable: `make check` on the three supported targets, with the race detector
# (every runner has a C compiler). A Postgres service is available on the Linux
# runners at 127.0.0.1:5432 (user postgres, trust auth); Windows runners cannot
# host Linux containers, so store-backed tests must not assume one there.
name: check

on:
  workflow_call:
    inputs:
      golangci-lint-version:
        type: string
        default: v2.12.2
      # The Lazarus release the developer runs; Windows takes the release installer,
      # Linux builds lazbuild and the LCL from the same release's source, since the
      # distribution packages lag by a major version. Every Lazarus 4 release pairs with
      # Free Pascal 3.2.2.
      lazarus-version:
        type: string
        default: "4.8"

permissions: {}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hadv_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install golangci-lint and govulncheck
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ inputs.golangci-lint-version }}
          go install golang.org/x/vuln/cmd/govulncheck@latest
      # Lazarus only where a repository holds a Lazarus project: the install is large and
      # most repositories have none. The built tree is cached per release and architecture.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: hashFiles('**/*.lpi') != ''
        id: lazarus
        with:
          path: ~/lazarus
          key: lazarus-${{ inputs.lazarus-version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install Free Pascal and GTK
        if: hashFiles('**/*.lpi') != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fpc libgtk2.0-dev
      - name: Build Lazarus ${{ inputs.lazarus-version }}
        if: hashFiles('**/*.lpi') != '' && steps.lazarus.outputs.cache-hit != 'true'
        run: |
          tag="lazarus_${LAZARUS_VERSION//./_}"
          mkdir -p ~/lazarus
          curl -sSL "https://gitlab.com/freepascal.org/lazarus/lazarus/-/archive/$tag/lazarus-$tag.tar.gz" | tar xz -C ~/lazarus --strip-components=1
          make -C ~/lazarus -s lazbuild lcl LCL_PLATFORM=gtk2
        env:
          LAZARUS_VERSION: ${{ inputs.lazarus-version }}
      - if: hashFiles('**/*.lpi') != ''
        run: echo "$HOME/lazarus" >> "$GITHUB_PATH"
      - run: make check RACE=-race COVER=-coverprofile=coverage.out
      # Coverage is a report, never a gate: a total and a per-package table in the job
      # summary, and the profile with its HTML rendering as an artifact.
      - name: Coverage report
        if: always()
        run: |
          [ -f coverage.out ] || { echo "No coverage profile: the tests did not run." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          go tool cover -html=coverage.out -o coverage.html
          {
            echo "## Coverage: $(go tool cover -func=coverage.out | awk '$1 == "total:" { print $NF }')"
            echo
            echo "A report, never a gate."
            echo
            echo "| Package | Statements | Covered |"
            echo "|---|---|---|"
            awk -v m="$(go list -m)/" 'NR > 1 { split($1, f, ":"); p = f[1]; sub(/\/[^\/]*$/, "", p); if (index(p, m) == 1) p = substr(p, length(m) + 1); n[p] += $2; if ($3 > 0) c[p] += $2 } END { for (p in n) printf "| %s | %d | %.1f%% |\n", p, n[p], 100 * c[p] / n[p] }' coverage.out | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.out
            coverage.html
          if-no-files-found: ignore
          retention-days: 14

  windows:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install make, golangci-lint and govulncheck
        shell: bash
        run: |
          choco install make --yes --no-progress
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ inputs.golangci-lint-version }}
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Install Lazarus ${{ inputs.lazarus-version }}
        if: hashFiles('**/*.lpi') != ''
        shell: pwsh
        run: |
          $v = "${{ inputs.lazarus-version }}"
          Invoke-WebRequest -Uri "https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%20$v/lazarus-$v-fpc-3.2.2-win64.exe/download" -OutFile lazarus-setup.exe -UserAgent "curl"
          Start-Process -Wait -FilePath .\lazarus-setup.exe -ArgumentList '/VERYSILENT', '/NORESTART', '/DIR=C:\lazarus'
          Remove-Item lazarus-setup.exe
          Add-Content $env:GITHUB_PATH 'C:\lazarus'
      - shell: bash
        run: make check RACE=-race COVER=-coverprofile=coverage.out
      - name: Coverage report
        if: always()
        shell: bash
        run: |
          [ -f coverage.out ] || { echo "No coverage profile: the tests did not run." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          go tool cover -html=coverage.out -o coverage.html
          {
            echo "## Coverage: $(go tool cover -func=coverage.out | awk '$1 == "total:" { print $NF }')"
            echo
            echo "A report, never a gate."
            echo
            echo "| Package | Statements | Covered |"
            echo "|---|---|---|"
            awk -v m="$(go list -m)/" 'NR > 1 { split($1, f, ":"); p = f[1]; sub(/\/[^\/]*$/, "", p); if (index(p, m) == 1) p = substr(p, length(m) + 1); n[p] += $2; if ($3 > 0) c[p] += $2 } END { for (p in n) printf "| %s | %d | %.1f%% |\n", p, n[p], 100 * c[p] / n[p] }' coverage.out | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-windows
          path: |
            coverage.out
            coverage.html
          if-no-files-found: ignore
          retention-days: 14
