# The estate scheduler. Jobs that need the work tooling join here when it exists.
name: Estate

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # `main` is the default branch and holds releases only; the few files GitHub reads
  # from the default branch must match `development` or they silently go stale.
  default-branch-drift:
    runs-on: ubuntu-24.04
    steps:
      - name: Compare default-branch-read files across main and development
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          drift=0
          for repo in $(gh repo list "$OWNER" --limit 100 --visibility public --json name --jq '.[].name'); do
            gh api "repos/$OWNER/$repo/branches/development" >/dev/null 2>&1 || continue
            for path in .github/dependabot.yml .github/workflows/scorecard.yml; do
              a=$(gh api "repos/$OWNER/$repo/contents/$path?ref=main" --jq .sha 2>/dev/null || echo none)
              b=$(gh api "repos/$OWNER/$repo/contents/$path?ref=development" --jq .sha 2>/dev/null || echo none)
              if [ "$a" != "$b" ]; then
                echo "::error::$OWNER/$repo: $path differs between main ($a) and development ($b)"
                drift=1
              fi
            done
          done
          exit $drift
